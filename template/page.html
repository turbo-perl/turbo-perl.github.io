<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<link rel="preload" href="/fonts/WebPlus_IBM_VGA_8x16.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="/css/turboperl.css">
</head>
<body data-page="{{page}}">
<div id="screen">

<ul id="menubar">
<li class="tv-menu">
<span class="tv-menu-title"><span class="tv-hot">F</span>ile</span>
<ul class="tv-menu-items">
<li><a href="/"><span class="tv-hot">H</span>ome</a></li>
<li class="tv-separator"></li>
<li><a href="#exit" data-command="exit" data-shortcut="Alt-X">E<span class="tv-hot">x</span>it</a></li>
</ul>
</li>
<li class="tv-menu">
<span class="tv-menu-title"><span class="tv-hot">H</span>elp</span>
<ul class="tv-menu-items">
<li><a href="#about" data-command="about"><span class="tv-hot">A</span>bout...</a></li>
</ul>
</li>
</ul>
<div id="clock"></div>

<div id="desktop">
<div id="desktop-pattern"></div>
<main id="window" class="tv-window">
<div class="tv-title">{{title}}</div>
<div class="tv-content">
{{content}}
</div>
</main>
<div id="about" class="tv-dialog" hidden>
<div class="tv-title">About</div>
<div class="tv-content">
<p>TurboPerl</p>
<p>A Turbo Pascal style IDE for Perl</p>
<p>Built with Free Pascal and Free Vision<br>
Editing Perl the way Turbo Pascal edited Pascal</p>
<button type="button" class="tv-button" data-command="ok"><span class="tv-hot">O</span>k</button>
</div>
</div>
</div>

<div id="statusline">
<a href="#exit" data-command="exit"><span class="tv-hot">Alt-X</span> Exit</a>
</div>

<div id="dos" hidden>C:\&gt; <span class="tv-cursor">_</span></div>

</div>
<script src="/js/turboperl.js"></script>
</body>
</html>
